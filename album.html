<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131b" media="(prefers-color-scheme: dark)">
<title>作品相簿（測試版）</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script>window.FIREBASE_CONFIG={apiKey:"AIzaSyDb96G_R9sEMudHAW6v5avvnMzE0c-4wXY",authDomain:"rollbook-cb3af.firebaseapp.com",projectId:"rollbook-cb3af",storageBucket:"rollbook-cb3af.firebasestorage.app",messagingSenderId:"643279455251",appId:"1:643279455251:web:549f12c03f17425a98abe6"};</script>
<style>
/* 家長作品頁：一欄，上方孩子名字，下面依作品分組的相片牆；不需要登入，只靠密碼讀自己孩子的相簿 */
:root{--paper:#f2f4f8;--card:#fff;--ink:#18202e;--ink-2:#5d6779;--line:#e1e5ec;--soft:#ebeef4;--indigo:#2b4f86;--indigo-soft:#e4ebf6;--seal:#c93c2f;--amber:#b9761a;
 --fd:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;--fb:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;--fn:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#0e131b;--card:#161d28;--ink:#e5e9f0;--ink-2:#97a2b3;--line:#263040;--soft:#1d2533;--indigo:#86a8de;--indigo-soft:#1e2a3e;--seal:#e7594d;--amber:#e1a447;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--fb);padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--fd);font-size:28px;margin:0;line-height:1.2;text-wrap:balance}
h2{font-family:var(--fd);font-size:19px;margin:0}
.muted{color:var(--ink-2);font-size:13px;margin:0}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgb(24 32 46 / .05),0 4px 14px rgb(24 32 46 / .05)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
input{font:inherit;font-size:20px;letter-spacing:.1em;font-family:var(--fn);text-transform:uppercase;color:var(--ink);background:var(--soft);border:0;border-radius:12px;padding:12px 14px;width:100%}
input:focus{outline:2px solid var(--indigo)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--indigo);color:var(--card)}
.btn.ghost{background:var(--soft);color:var(--ink);font-weight:500;padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.err{color:var(--seal);font-size:14px;margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;color:var(--indigo);font-weight:700;letter-spacing:.06em}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.th{position:relative;border:0;padding:0;background:var(--soft);border-radius:10px;overflow:hidden;aspect-ratio:1}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th i{position:absolute;left:5px;bottom:5px;font-style:normal;font-size:10px;font-weight:700;background:var(--seal);color:#fff;border-radius:5px;padding:0 5px}
.empty{text-align:center;color:var(--ink-2);padding:28px 12px}
.view{position:fixed;inset:0;z-index:10;background:rgb(8 12 20 / .94);display:flex;flex-direction:column;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
.vbar{display:flex;align-items:center;gap:10px;min-height:44px}
.vbar b{font-family:var(--fd);font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar span{font-size:12px;opacity:.75;white-space:nowrap}
.vbtn{border:0;background:rgb(255 255 255 / .14);color:#fff;border-radius:10px;min-width:44px;height:44px;font-size:20px}
.vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.vimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;-webkit-touch-callout:default}
.vnav{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px}
.vnav p{margin:0;opacity:.75;text-align:center;flex:1}
</style>
</head><body>
<div class="wrap">
  <section id="gate" class="card">
    <span class="eyebrow">作品相簿</span>
    <h1>看看孩子的作品</h1>
    <p class="muted">請輸入老師給你的密碼。</p>
    <form id="gate-form"><label>密碼<input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" maxlength="12" placeholder="ABCD-EFGH"></label>
    <p class="err" id="err" hidden></p>
    <button class="btn" id="go" type="submit" style="margin-top:12px;width:100%">打開相簿</button></form>
    <p class="muted">這個頁面只會顯示這組密碼對應的相簿，看不到其他小朋友的照片。密碼請不要轉給別人。</p>
  </section>
  <section id="album" hidden>
    <div class="head"><div><span class="eyebrow" id="a-level"></span><h1 id="a-name"></h1><p class="muted" id="a-count"></p></div><button class="btn ghost" id="out">換一組密碼</button></div>
    <div id="groups" class="wrap" style="gap:18px;margin-top:16px"></div>
    <p class="muted" style="margin-top:20px">照片由教室老師上傳。想移除任何一張，請直接告訴老師。在大圖上長按可以儲存照片。</p>
  </section>
</div>
<div class="view" id="view" hidden role="dialog" aria-modal="true" aria-label="作品大圖">
  <div class="vbar"><b id="v-title"></b><span id="v-meta"></span><button class="vbtn" id="v-close" aria-label="關閉">✕</button></div>
  <div class="vimg"><img id="v-img" alt=""></div>
  <div class="vnav"><button class="vbtn" id="v-prev" aria-label="上一張">‹</button><p id="v-pos"></p><button class="vbtn" id="v-next" aria-label="下一張">›</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>{const[,m,d]=String(s).split('-');return (+m)+'/'+(+d)};
const norm=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const KEY='album.code';
const saved=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return ''}};
const remember=c=>{try{c?localStorage.setItem(KEY,c):localStorage.removeItem(KEY)}catch(e){}};
let db=null,aid=null,photos=[],cur=-1;const full={};
function fb(){if(db)return db;if(!window.firebase||!firebase.firestore)throw new Error('offline');
  db=((firebase.apps.find(x=>x.name==='rbtest')||firebase.initializeApp(window.FIREBASE_CONFIG,'rbtest'))).firestore();return db}
function fail(m){const e=$('err');e.textContent=m;e.hidden=false;$('go').disabled=false;$('go').textContent='打開相簿'}
async function open(code,quiet){
  const c=norm(code);if(c.length<8){if(!quiet)fail('密碼是 8 個英文字母或數字，請再確認一次。');return}
  $('err').hidden=true;$('go').disabled=true;$('go').textContent='開啟中…';
  try{const id=await sha256(c),a=await fb().collection('test_albums').doc(id).get();
    if(!a.exists){remember('');if(quiet){$('go').disabled=false;$('go').textContent='打開相簿';return}return fail('找不到這組密碼的相簿，請確認有沒有打錯。')}
    const qs=await fb().collection('test_albums').doc(id).collection('photos').orderBy('at','desc').limit(400).get();
    aid=id;photos=[];qs.forEach(d=>photos.push({id:d.id,...d.data()}));remember(c);show(a.data())}
  catch(e){fail(e&&e.message==='offline'?'連不上網路，請檢查連線後再試。':'現在讀不到相簿，請稍後再試。')}
}
function show(a){
  $('gate').hidden=true;$('album').hidden=false;$('go').disabled=false;$('go').textContent='打開相簿';
  $('a-name').textContent=(a.name||'')+' 的作品';$('a-level').textContent=a.level||'作品相簿';document.title=(a.name||'')+' 的作品相簿';
  const groups=[];for(const p of photos){let g=groups.find(x=>x.work===p.work);if(!g)groups.push(g={work:p.work,items:[]});g.items.push(p)}
  $('a-count').textContent=photos.length?`${groups.length} 件作品・${photos.length} 張照片`:'';
  $('groups').innerHTML=groups.length?groups.map(g=>{const a0=g.items[g.items.length-1].date,b0=g.items[0].date;
    return `<div class="group"><div class="ghead"><h2>${esc(g.work||'未命名')}</h2><span class="muted num">${md(a0)}${a0!==b0?'–'+md(b0):''}・${g.items.length} 張</span></div>
    <div class="grid">${g.items.map(p=>`<button class="th" data-id="${esc(p.id)}" aria-label="${esc(g.work||'作品')} ${esc(p.date)}"><img src="${esc(p.thumb)}" alt="" loading="lazy">${p.kind==='final'?'<i>完成</i>':''}</button>`).join('')}</div></div>`}).join('')
    :'<div class="card empty">老師還沒有上傳照片，過幾天再來看看。</div>';
}
async function view(i){
  if(i<0||i>=photos.length)return;cur=i;const p=photos[i];
  $('view').hidden=false;document.body.style.overflow='hidden';
  $('v-title').textContent=p.work||'未命名';$('v-meta').textContent=(p.kind==='final'?'完成作品':'繪畫過程')+'・'+md(p.date);
  $('v-pos').textContent=`${i+1} / ${photos.length}　長按圖片可以儲存`;$('v-prev').disabled=i===0;$('v-next').disabled=i===photos.length-1;
  const im=$('v-img');im.alt=(p.work||'作品')+' '+p.date;im.src=full[p.id]||p.thumb;
  if(!full[p.id])try{const d=await fb().collection('test_albums').doc(aid).collection('full').doc(p.id).get();if(d.exists){full[p.id]=d.data().img;if(cur===i)im.src=full[p.id]}}catch(e){}
}
function closeView(){$('view').hidden=true;document.body.style.overflow='';cur=-1}
$('gate-form').addEventListener('submit',e=>{e.preventDefault();open($('code').value)});
$('groups').addEventListener('click',e=>{const b=e.target.closest('.th');if(b)view(photos.findIndex(p=>p.id===b.dataset.id))});
$('out').addEventListener('click',()=>{remember('');aid=null;photos=[];$('album').hidden=true;$('gate').hidden=false;$('code').value='';document.title='作品相簿'});
$('v-close').addEventListener('click',closeView);$('v-prev').addEventListener('click',()=>view(cur-1));$('v-next').addEventListener('click',()=>view(cur+1));
document.addEventListener('keydown',e=>{if($('view').hidden)return;if(e.key==='Escape')closeView();if(e.key==='ArrowLeft')view(cur-1);if(e.key==='ArrowRight')view(cur+1)});
let sx=null;$('view').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('view').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60)view(cur+(dx<0?1:-1))},{passive:true});
const c0=saved();if(c0){$('code').value=c0.slice(0,4)+'-'+c0.slice(4);open(c0,true)}
})();
</script>
</body></html>
